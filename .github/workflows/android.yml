name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      - name: Build APKs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building release APKs"
            ./gradlew :app:assembleRelease --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk 2>/dev/null | head -n1 || true)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk 2>/dev/null | head -n1 || true)
          else
            echo "Building debug APKs"
            ./gradlew :app:assembleDebug --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/debug/*.apk 2>/dev/null | head -n1 || true)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/debug/*.apk 2>/dev/null | head -n1 || true)
          fi
          echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
          echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"

      - name: Package artifacts
        run: |
          mkdir -p dist
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            OUT="HanTV-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="HanTV-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            cp "$ARM_SRC" "dist/HanTV-TV.apk"
            if [ -n "$X86_SRC" ] && [ -f "$X86_SRC" ]; then
              cp "$X86_SRC" "dist/HanTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
              echo "Packaged dist/HanTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "HanTV ${{ github.ref_name }} release" > dist/RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HanTV ${{ github.ref_name }}
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
